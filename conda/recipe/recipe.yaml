# Conda recipe of the library fhhos4 (rattler-build, v1 format): the package fhhos4, the library alone
# (ENABLE_PROGRAM=OFF), which only needs Eigen. The program is not packaged.
# Local build, from this clone: rattler-build build -r conda/recipe -c conda-forge --experimental (README_library.md).
# For conda-forge (staged-recipes, then the feedstock): the version written out, and the archive of the release tag as
# source (url and sha256 below).
context:
  # The version of project() in CMakeLists.txt, its only place (load_from_file: --experimental)
  version: ${{ (load_from_file("../../CMakeLists.txt") | split("project(fhhos4 VERSION ") | list)[1] | split(" ") | first }}

package:
  name: fhhos4
  version: ${{ version }}

source:
  path: ../..
  # url: https://github.com/pmatalon/fhhos4/archive/refs/tags/v${{ version }}.tar.gz
  # sha256: <sha256sum of the archive>

build:
  number: 0
  # Linux only for now: the other platforms are not tested
  skip: not linux
  script:
    - cmake -S . -B build-library -G Ninja ${CMAKE_ARGS} -DCMAKE_BUILD_TYPE=Release -DENABLE_PROGRAM=OFF
    - cmake --build build-library
    - cmake --install build-library --component library

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - eigen
  run:
    # Eigen objects cross the interface of the library: their memory layout is the same in Eigen 3.4 and 5.x, whatever
    # the alignment settings (fhhos4::Solver's constructor checks it)
    - eigen >=3.4
  run_exports:
    # Binary compatibility within a minor version only (SOVERSION major.minor)
    - ${{ pin_subpackage('fhhos4', upper_bound='x.x') }}

tests:
  - package_contents:
      lib:
        - fhhos4
      include:
        - fhhos4
        - fhhos4.h
        - fhhos4_error.h
        - fhhos4_version.h
      files:
        - lib/cmake/fhhos4/fhhos4Config.cmake
        - lib/cmake/fhhos4/fhhos4ConfigVersion.cmake
        - lib/cmake/fhhos4/fhhos4Targets.cmake
  - files:
      # The test client of the sources, also in the release archive (conda-forge's recipe takes it from there)
      source:
        - conda/recipe/test/
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
    script:
      # A client code: find_package(fhhos4), then a solve with the uncondensed interface
      - cmake -S conda/recipe/test -B build-test -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXPECTED_VERSION=${{ version }}
      - cmake --build build-test
      - ./build-test/fhhos4_client
      # The same, compiled for the CPU of the machine: other alignment settings than the library's (with AVX)
      - cmake -S conda/recipe/test -B build-test-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXPECTED_VERSION=${{ version }} -DCMAKE_CXX_FLAGS=-march=native
      - cmake --build build-test-native
      - ./build-test-native/fhhos4_client
  - files:
      # The test client of the sources, also in the release archive (conda-forge's recipe takes it from there)
      source:
        - conda/recipe/test/
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
        # The oldest Eigen the package accepts, for the client code: the library may be built with another one
        - eigen 3.4.*
    script:
      - cmake -S conda/recipe/test -B build-test -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXPECTED_VERSION=${{ version }}
      - cmake --build build-test
      - ./build-test/fhhos4_client

about:
  homepage: https://github.com/pmatalon/fhhos4
  repository: https://github.com/pmatalon/fhhos4
  summary: Algebraic multigrid (U-AMG) for the linear systems of hybrid discretizations (HHO, HDG)
  description: |
    The library of fhhos4: an algebraic multigrid method for the linear systems arising from hybrid discretizations
    (HHO, HDG...) of diffusion and convection-diffusion problems, symmetric or not. p-multigrid levels, then h-levels
    by aggregation, from the blocks of the uncondensed matrix. Only depends on Eigen.
  license: LGPL-3.0-or-later
  license_file:
    - COPYING.LESSER
    - COPYING

extra:
  recipe-maintainers:
    - pmatalon
